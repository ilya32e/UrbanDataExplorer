# Load-balancer nginx devant les replicas de l'API (C1.4).
# Le resolver Docker (127.0.0.11) est interroge a chaque requete : nginx repartit
# ainsi le trafic sur tous les conteneurs du service `api` (round-robin DNS),
# meme quand on change le nombre de replicas a chaud.
server {
    listen 80;

    resolver 127.0.0.11 valid=5s;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Failover : on bascule sur un autre replica si l'un repond mal.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
